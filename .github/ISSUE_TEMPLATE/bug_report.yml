name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: 1. Open… 2. Tap… 3. See…
  - type: input
    id: version
    attributes:
      label: TrackerLens version (⋮ menu → About, or the release you installed)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone model and Android version
      placeholder: Pixel 8, Android 16
  - type: textarea
    id: notes
    attributes:
      label: Anything else (screenshots welcome; please don't include personal data)
