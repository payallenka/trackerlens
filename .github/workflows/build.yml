name: build
on:
  push:
  pull_request:

# Read-only token: this workflow only builds and tests.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Third-party actions are pinned to exact commits (tag in the comment) so a moved tag can't change the build.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      # Also validates the committed gradle-wrapper.jar against Gradle's published checksums.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Unit tests
        run: ./gradlew :core:test
      - name: Build debug and release APKs (and compile the device tests)
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest
      - name: Verify neither APK can use the network
        # pipefail + explicit checks: a missing APK or a failing aapt2 must fail the step, not pass silently.
        shell: bash
        run: |
          set -euo pipefail
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          for apk in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release-unsigned.apk; do
            test -f "$apk"
            "$AAPT" dump permissions "$apk" | tee perms.txt
            grep -q "^package:" perms.txt
            if grep -q "android.permission.INTERNET" perms.txt; then echo "INTERNET found in $apk"; exit 1; fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trackerlens-debug
          path: app/build/outputs/apk/debug/app-debug.apk
